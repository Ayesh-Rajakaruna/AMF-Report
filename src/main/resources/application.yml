server:
  port: 8080

spring:
  application:
    name: amf-report
  datasource:
    url: jdbc:mysql://localhost:3306/amf_report?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # creates/updates the loyalty_earn_record table from the entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true
