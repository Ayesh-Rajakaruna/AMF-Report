server:
  port: 8080

spring:
  application:
    name: amf-report
  datasource:
    url: jdbc:mysql://localhost:3306/amf_report?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # creates/updates the loyalty_earn_record table from the entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ---- loyaltyEarn TMF API ----
loyalty:
  api:
    loyalty-earn-url: https://dev-orderexpress.08894fb17d.sdpamp.com/tox-tx-layer-loyalty-mgt/tmf-api/loyalty/v4/loyaltyEarn

# ---- Optional trust store for the API's TLS certificate ----
# e.g. TRUST_STORE=file:D:/certs/truststore.jks  or  classpath:truststore.jks
trust:
  store: ${TRUST_STORE:}
  password: ${TRUST_STORE_PASSWORD:}
