server:
  port: 8080

spring:
  application:
    name: amf-report

loyalty:
  api:
    loyalty-earn-url: https://dev-orderexpress.08894fb17d.sdpamp.com/tox-tx-layer-loyalty-mgt/tmf-api/loyalty/v4/loyaltyEarn?usageCharacteristic.value=Upfront&usageCharacteristic.value=Monthly
    loyalty-rule-url: https://dev-orderexpress.08894fb17d.sdpamp.com/tox-tx-layer-loyalty-mgt/tmf-api/loyalty/v4/loyaltyRule
    loyalty-program-member-url: https://dev-orderexpress.08894fb17d.sdpamp.com/tox-tx-layer-loyalty-mgt/tmf-api/loyalty/v4/loyaltyProgramMember
    loyalty-account-balance-url: https://dev-orderexpress.08894fb17d.sdpamp.com/tox-tx-layer-loyalty-mgt/tmf-api/loyalty/v4/loyaltyAccountBalance?balanceType=UpfrontBalanceTotal&balanceType=EarningBalanceTotal&balanceType=ManualCreditBalanceTotal

product-group:
  api:
    base-urls:
      DEV: https://dev-orderexpress.08894fb17d.sdpamp.com
      QA: https://qa-orderexpress.08894fb17d.sdpamp.com
      PREPROD: https://preprod-api.orderexchange.telstra.com.au
      PROD: https://prod-api.orderexchange.telstra.com.au
    product-group-path: /journey-service-product-journey/product-journey/product/groups/{productGroupId}
    organization-path: /tox-tx-layer-party-mgt/tmf-api/partyManagement/v5/organization
    organization-chunk-threshold: 30
    organization-chunk-size: 25

report:
  output-dir: reports

http:
  proxy:
    enabled: ${PROXY_ENABLED:true}
    scheme: http
    host: http-gw.tcif.telstra.com.au
    port: 8080
    username: ${PROXY_USERNAME:e045577}
    password: ${PROXY_PASSWORD:}
  timeout:
    connect-seconds: 30
    read-seconds: 60

trust:
  store: ${TRUST_STORE:}
  password: ${TRUST_STORE_PASSWORD:}
